# ==========================================
# 1. POSTGRESQL (VRS Security DB)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrs-security-postgres
spec:
  selector:
    matchLabels:
      app: security-db
  template:
    metadata:
      labels:
        app: security-db
    spec:
      containers:
        - name: postgres
          image: postgres:latest
          env:
            - name: POSTGRES_DB
              value: "vrs_security_db"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: vrs-security-postgres
spec:
  selector:
    app: security-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---
# ==========================================
# 2. REDIS (VRS Security Cache)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrs-security-redis
spec:
  selector:
    matchLabels:
      app: security-redis
  template:
    metadata:
      labels:
        app: security-redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          command: ["redis-server", "--requirepass", "admin"]
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: vrs-security-redis
spec:
  selector:
    app: security-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

---
