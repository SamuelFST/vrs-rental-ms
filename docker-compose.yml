version: '3'
services:
  vrs-rental-ms:
    container_name: vrs-rental-ms
    build: './'
    depends_on:
      - vrs-rental-mongo
      - vrs-rabbitmq
      - vrs-rental-s3
    environment:
      - MONGODB_USER=admin
      - MONGODB_PASSWORD=adminSecret123
      - MONGODB_HOST=vrs-rental-mongo
      - MONGODB_PORT=27017
      - MONGODB_NAME=vrs_rental
      - RABBITMQ_HOST=vrs-rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - RENTAL_SERVICE_ID=rental-ms@vrs.com
      - RENTAL_SERVICE_SECRET=vrs-rental-ms@rental_secret
      - PAYMENT_BASE_URL=http://localhost:9999
      - VEHICLE_BASE_URL=http://vrs-vehicle-ms:8042
      - SECURITY_BASE_URL=http://vrs-security-ms:8041
      - AWS_ACCESS_KEY_ID=myKey
      - AWS_SECRET_ACCESS_KEY=myKey
      - AWS_REGION=us-west-2
      - AWS_S3_ENDPOINT=http://vrs-rental-s3:4566
      - AWS_S3_BUCKET=rentals-bucket
      - AWS_S3_EXPOSURE_ENDPOINT=http://localhost:4567
      - PAYMENT_API_KEY=my-api-key
    networks:
      - vrs-network
    ports:
      - 8043:8043

  vrs-rental-mongo:
    image: mongo:latest
    container_name: vrs-rental-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminSecret123
      - MONGO_INITDB_DATABASE=vrs_rental
    restart: always
    ports:
      - 27027:27017
    networks:
      - vrs-network

  vrs-rabbitmq:
    image: rabbitmq:3-management
    container_name: vrs-rabbitmq
    hostname: vrs-rabbitmq
    networks:
      - vrs-network
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - 5672:5672
      - 25676:25676
      - 15672:15672

  vrs-rental-s3:
    image: localstack/localstack
    container_name: vrs-rental-s3
    ports:
      - "4567:4566"
      - "8056:8080"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - AWS_ACCESS_KEY_ID=myKey
      - AWS_SECRET_ACCESS_KEY=myKey
      - AWS_REGION=us-west-2
    volumes:
      - ./tmp/localstack:/tmp/localstack
      - ./aws:/etc/localstack/init/ready.d
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vrs-network

networks:
  vrs-network:
    external: true