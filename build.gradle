plugins {
	id 'java'
	id 'jacoco'
	id 'pmd'
	id 'org.owasp.dependencycheck' version '12.1.5'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'vrs'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

jar {
	enabled = false
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.0")
	set('mapstructVersion', "1.6.3")
	set('springDocVersion', "2.8.9")
	set('itextpdfVersion', "9.2.0")
}

jacoco {
	toolVersion = "0.8.11"
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.20.100')
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"
	implementation "com.itextpdf:itext7-core:${itextpdfVersion}"
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'software.amazon.awssdk:s3'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.amqp:spring-rabbit-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport

	testLogging {
		events "passed", "skipped", "failed"
	}
}

jacocoTestReport {
	dependsOn test

	classDirectories.setFrom(
			fileTree('build/classes/java/main') {
				exclude 'vrs/rental_ms/config/**'
				exclude 'vrs/rental_ms/constants/**'
				exclude 'vrs/rental_ms/dto/**'
				exclude 'vrs/rental_ms/entity/**'
				exclude 'vrs/rental_ms/enums/**'
				exclude 'vrs/rental_ms/exception/**'
				exclude 'vrs/rental_ms/repository/**'
				exclude 'vrs/rental_ms/RentalMsApplication.class'
			}
	)

	reports {
		xml.required = false
		html.required = true
		csv.required = false
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			element = 'PACKAGE'
			includes = ['vrs.rental_ms.**']
			excludes = [
					'vrs.rental_ms.config.*',
					'vrs.rental_ms.constants.*',
					'vrs.rental_ms.dto.*',
					'vrs.rental_ms.entity.*',
					'vrs.rental_ms.enums.*',
					'vrs.rental_ms.exception.*',
					'vrs.rental_ms.repository.*',
					'vrs.rental_ms.VehicleMsApplication'
			]
			limit {
				counter = 'CLASS'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

pmd {
	toolVersion = '7.24.0'
	consoleOutput = true
	ignoreFailures = false
	ruleSets = [
			'category/java/errorprone.xml',
			'category/java/bestpractices.xml'
	]
}

dependencyCheck {
	failBuildOnCVSS = 7.0
}
