name: VRS Java CI Gradle Spring Boot

on:
  push:
    branches:
      - "master"
      - "feat/*"
      - "fix/*"
  pull_request:
    branches:
     - "master"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Copy source code
        uses: actions/checkout@v4

      - name: Java Configuration (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle execution permission
        run: chmod +x ./gradlew

      - name: Run Build With Tests
        run: ./gradlew build