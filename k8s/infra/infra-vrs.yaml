# ==========================================
# 4. MONGODB
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrs-mongodb
spec:
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "root"
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "root"
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: vrs-rental-mongo
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

---
# ==========================================
# 5. RABBITMQ
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrs-rabbitmq
spec:
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"
          ports:
            - containerPort: 5672
            - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: vrs-rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
    - name: management
      protocol: TCP
      port: 15672
      targetPort: 15672

---
# ==========================================
# 5. S3 (VRS S3)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrs-s3
spec:
  selector:
    matchLabels:
      app: vrs-s3
  template:
    metadata:
      labels:
        app: vrs-s3
    spec:
      containers:
        - name: localstack
          image: localstack/localstack
          env:
            - name: SERVICES
              value: "s3"
            - name: DEBUG
              value: "1"
            - name: DATA_DIR
              value: "/tmp/localstack/data"
            - name: AWS_ACCESS_KEY_ID
              value: "myKey"
            - name: AWS_SECRET_ACCESS_KEY
              value: "myKey"
            - name: AWS_REGION
              value: "us-west-2"
            - name: HOSTNAME_EXTERNAL
              value: "s3.vrs.cloud"
          ports:
            - containerPort: 4566
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: init-scripts
              mountPath: /etc/localstack/init/ready.d
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: init-scripts
          configMap:
            name: localstack-init-script
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: vrs-localstack-service
spec:
  selector:
    app: vrs-s3
  ports:
    - protocol: TCP
      port: 4566
      targetPort: 4566
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vrs-s3-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: s3.vrs.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vrs-localstack-service
                port:
                  number: 4566
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init-script
data:
  init-s3.sh: |
    #!/bin/bash
    echo "Starting S3 Bucket Setup"
    awslocal s3 mb s3://vehicles-bucket
    awslocal s3 mb s3://rentals-bucket
    echo "S3 Bucket Setup Complete."