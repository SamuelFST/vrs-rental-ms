name: VRS Java CI

on:
  push:
    branches:
      - "master"
      - "feat/*"
      - "fix/*"
  pull_request:
    branches:
      - "master"

jobs:
  build:
    name: Build & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Java Configuration (JDK 17)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle execution permission
        run: chmod +x ./gradlew

      - name: Run Build With Tests
        run: ./gradlew build -x pmdMain -x pmdTest -x dependencyCheckAnalyze

  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Super-Linter
        uses: super-linter/super-linter/slim@v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_JAVA: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          MULTI_STATUS: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          LOG_LEVEL: DEBUG
          LINTER_RULES_PATH: '.github/linters'
          JAVA_FILE_NAME: 'checkstyle.xml'

  pmd:
    name: PMD Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Java Configuration (JDK 17)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle execution permission
        run: chmod +x ./gradlew

      - name: Run PMD
        run: ./gradlew pmdMain pmdTest

